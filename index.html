<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset='utf-8' />
    <title>Bread, Pounds and Protest: Mapping economic protests in Lebanon since 1987</title>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
    <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/mapbox/assembly/publisher-staging/src/svgs/mapbox.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <script src='https://api.tiles.mapbox.com/mapbox-gl-js/v2.11.0/mapbox-gl.js'></script>
    <link href='https://api.tiles.mapbox.com/mapbox-gl-js/v2.11.0/mapbox-gl.css' rel='stylesheet' />
    <script src="https://unpkg.com/intersection-observer@0.12.0/intersection-observer.js"></script>
    <script src="https://unpkg.com/scrollama"></script>
    <style>
        :root {
            --ink: #111;
            --paper: #faf9f6;
            --head: 'Playfair Display', 'Times New Roman', Georgia, serif;
            --serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
            --sans: 'Archivo Narrow', 'Arial Narrow', Arial, sans-serif;
            --ticker-h: 44px;
        }
        html { scroll-behavior: auto; }
        body {
            margin: 0;
            padding: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: var(--serif);
        }
        a, a:hover, a:visited { color: var(--ink); }

        /* ---------- map + story scaffolding ---------- */
        #map { top: 0; height: 100vh; width: 100vw; position: fixed; }
        /* the page's sections are transparent; let clicks fall through to the map */
        #story { position: relative; pointer-events: none; }
        #masthead, #footer { pointer-events: auto; }
        .step { height: 110vh; }
        #features { padding: 0; }
        /* keep Mapbox logo + attribution above the ticker */
        .mapboxgl-ctrl-bottom-left, .mapboxgl-ctrl-bottom-right { bottom: calc(var(--ticker-h) + 4px); }

        /* ---------- masthead (full-screen opening) ---------- */
        #masthead {
            position: relative;
            z-index: 5;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4vh 6vw 6vh;
            background: var(--paper);
            color: var(--ink);
        }
        .mast-top {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            border-top: 4px solid var(--ink);
            border-bottom: 1px solid var(--ink);
            padding: 8px 0;
            font: 700 12px/1.2 var(--sans);
            letter-spacing: .16em;
            text-transform: uppercase;
        }
        #masthead h1 {
            margin: .16em 0 .06em;
            text-align: center;
            font: 900 clamp(52px, 11vw, 170px)/.92 var(--head);
            letter-spacing: -.02em;
        }
        #masthead h2 {
            margin: 0 0 3vh;
            padding-bottom: 2vh;
            text-align: center;
            font: italic 400 clamp(17px, 2.1vw, 30px)/1.25 var(--serif);
            border-bottom: 1px solid var(--ink);
        }
        .intro {
            max-width: 1100px;
            margin: 0 auto;
            column-count: 2;
            column-gap: 4vw;
            column-rule: 1px solid var(--ink);
            font-size: clamp(14px, 1.15vw, 17px);
            line-height: 1.6;
            text-align: justify;
            hyphens: auto;
        }
        .intro p { margin: 0 0 .8em; }
        .intro p:first-child::first-letter {
            float: left;
            padding: .07em .1em 0 0;
            font: 900 4.1em/.78 var(--head);
        }
        .cue {
            margin-top: 3vh;
            text-align: center;
            font: 700 12px/1 var(--sans);
            letter-spacing: .2em;
            text-transform: uppercase;
        }
        .cue span { display: inline-block; animation: bob 1.8s ease-in-out infinite; }
        @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(5px); } }

        /* ---------- chapter cards (fixed; swap at each section) ---------- */
        #cards { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
        .card {
            position: absolute;
            top: 10vh;
            box-sizing: border-box;
            width: 34vw;
            max-height: calc(100vh - 10vh - var(--ticker-h) - 24px);
            overflow-y: auto;
            padding: 20px 24px 22px;
            background: var(--paper);
            color: var(--ink);
            border: 1px solid var(--ink);
            box-shadow: 5px 5px 0 var(--ink);
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: opacity .45s ease, transform .45s ease, visibility 0s linear .45s;
        }
        .card.lefty { left: 4vw; }
        .card.righty { right: 4vw; }
        .card.centered { left: 25vw; width: 50vw; }
        body.map-on .card.on {
            opacity: 1;
            visibility: visible;
            transform: none;
            pointer-events: auto;
            transition: opacity .45s ease .1s, transform .45s ease .1s, visibility 0s;
        }
        .card-kicker {
            font: 700 11px/1 var(--sans);
            letter-spacing: .16em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .card h3 {
            margin: 0 0 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--ink);
            font: 900 clamp(21px, 2.1vw, 31px)/1.08 var(--head);
        }
        .card-body {
            font-size: clamp(12.5px, .98vw, 14.5px);
            line-height: 1.52;
            text-align: justify;
            hyphens: auto;
        }
        .card-body p { margin: 0 0 .8em; }
        .card-body p:last-child { margin-bottom: 0; }
        .card-body em { hyphens: none; }

        /* words highlighted from the protests: a black highlighter sweeps in when the card appears */
        mark.hl {
            color: inherit;
            padding: 0 3px;
            cursor: pointer;
            background-color: transparent;
            background-image: linear-gradient(var(--ink), var(--ink));
            background-repeat: no-repeat;
            background-position: 0 100%;
            background-size: 0% 100%;
            transition: background-size .9s ease .5s, color .4s ease .6s;
            -webkit-box-decoration-break: clone;
            box-decoration-break: clone;
        }
        body.map-on .card.on mark.hl { background-size: 100% 100%; color: var(--paper); }

        /* ---------- nationwide protests: quiet pulses at the side ---------- */
        #pulses {
            position: fixed;
            z-index: 7;
            top: 50%;
            transform: translateY(-50%);
            min-width: 150px;
            padding: 10px 12px 6px;
            background: var(--paper);
            border: 1px solid var(--ink);
            box-shadow: 3px 3px 0 var(--ink);
            font-family: var(--sans);
            opacity: 0;
            visibility: hidden;
            transition: opacity .4s ease, visibility 0s linear .4s;
        }
        body.map-on #pulses:not(.empty) { opacity: 1; visibility: visible; transition: opacity .4s ease, visibility 0s; }
        #pulses[data-side="right"] { right: 2.5vw; }
        #pulses[data-side="left"] { left: 2.5vw; }
        .pl-head strong {
            display: block;
            padding-bottom: 5px;
            border-bottom: 1px solid var(--ink);
            font: 700 11px/1 var(--sans);
            letter-spacing: .16em;
            text-transform: uppercase;
        }
        .pl-head span { display: block; margin: 5px 0 3px; font: italic 400 11px/1.2 var(--serif); }
        .pulse {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 5px 2px;
            border: 0;
            background: none;
            color: var(--ink);
            font: 500 13px/1.1 var(--sans);
            letter-spacing: .03em;
            text-align: left;
            cursor: pointer;
        }
        .pulse:hover .pl-date, .pulse.on .pl-date { text-decoration: underline; }
        .dot {
            position: relative;
            flex: none;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--ink);
        }
        .dot::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 50%;
            border: 1.5px solid var(--ink);
            animation: pulse 2.8s ease-out infinite;
            animation-delay: var(--d, 0s);
        }
        @keyframes pulse { 0% { transform: scale(1); opacity: .65; } 100% { transform: scale(3.4); opacity: 0; } }
        .pulse.on .dot { background: var(--paper); box-shadow: 0 0 0 2px var(--ink); }

        /* ---------- news ticker ---------- */
        #ticker {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            z-index: 20;
            height: var(--ticker-h);
            box-sizing: border-box;
            display: flex;
            align-items: stretch;
            background: #000;
            color: #fff;
            border-top: 2px solid #fff;
            transform: translateY(100%);
            transition: transform .5s ease;
        }
        body.map-on #ticker:not(.empty) { transform: none; }
        .tk-label {
            flex: none;
            display: flex;
            align-items: center;
            padding: 0 16px;
            background: #fff;
            color: #000;
            font: 700 13px/1 var(--sans);
            letter-spacing: .16em;
            text-transform: uppercase;
        }
        .tk-window {
            flex: 1;
            overflow: hidden;
            -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 36px, #000 calc(100% - 36px), transparent 100%);
            mask-image: linear-gradient(90deg, transparent 0, #000 36px, #000 calc(100% - 36px), transparent 100%);
        }
        .tk-track {
            display: inline-flex;
            height: 100%;
            align-items: center;
            white-space: nowrap;
            animation: tk 120s linear infinite;
            will-change: transform;
        }
        .tk-track:hover { animation-play-state: paused; }
        @keyframes tk { from { transform: translateX(0); } to { transform: translateX(-50%); } }
        .tk-group { display: inline-flex; align-items: center; }
        .tk-item { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
        .tk-item::after { content: ''; width: 7px; height: 7px; margin: 0 26px; background: #fff; opacity: .55; }
        .tk-item:hover .tk-text { text-decoration: underline; }
        .tk-tag {
            padding: 3px 6px 2px;
            border: 1px solid #fff;
            font: 700 10px/1 var(--sans);
            letter-spacing: .14em;
            text-transform: uppercase;
        }
        .tk-item.quote .tk-tag { background: #fff; color: #000; }
        .tk-quote { font: italic 400 16px/1 var(--serif); }
        .tk-head { font: 500 15px/1 var(--sans); letter-spacing: .05em; text-transform: uppercase; }
        .tk-src { font: 500 12px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: #b8b8b8; }

        /* ---------- article-style popups ---------- */
        .mapboxgl-popup { z-index: 10; }
        .mapboxgl-popup-tip { display: none; }
        .mapboxgl-popup-content {
            width: 260px;
            padding: 0;
            background: #fff;
            color: #111;
            border: 1px solid #111;
            border-radius: 0;
            box-shadow: 3px 3px 0 #111;
            font-family: var(--serif);
        }
        .mapboxgl-popup-close-button {
            top: 3px; right: 3px;
            width: 20px; height: 20px;
            padding: 0;
            color: #111;
            font: 400 18px/18px var(--sans);
            border-radius: 0;
        }
        .mapboxgl-popup-close-button:hover { background: #111; color: #fff; }
        .popup-text { max-height: 220px; overflow-y: auto; padding: 10px 12px 12px; }
        .clip + .clip { margin-top: 12px; padding-top: 10px; border-top: 1px solid #111; }
        .clip-meta {
            margin: 0 0 6px;
            padding: 0 20px 4px 0;
            border-bottom: 2px solid #111;
            font: 700 10px/1.3 var(--sans);
            letter-spacing: .12em;
            text-transform: uppercase;
        }
        .clip-hed { margin: 0 0 4px; font: 900 16px/1.15 var(--head); }
        .clip-deck { margin: 0 0 6px; font: italic 400 12px/1.3 var(--serif); }
        .clip-body { margin: 0; font-size: 12.5px; line-height: 1.45; text-align: justify; hyphens: auto; }

        /* ---------- footer ---------- */
        #footer {
            position: relative;
            z-index: 5;
            padding: 5vh 5vw calc(var(--ticker-h) + 36px);
            background: var(--paper);
            border-top: 4px solid var(--ink);
            text-align: center;
            font: 700 13px/1.4 var(--sans);
            letter-spacing: .16em;
            text-transform: uppercase;
        }

        /* ---------- small screens ---------- */
        @media (max-width: 900px) {
            .intro { column-count: 1; }
        }
        @media (max-width: 750px) {
            .card, .card.lefty, .card.righty, .card.centered {
                left: 5vw; right: auto; width: 90vw;
                top: 8vh;
                max-height: calc(100vh - 8vh - var(--ticker-h) - 120px);
            }
            #pulses, #pulses[data-side] {
                top: auto; bottom: calc(var(--ticker-h) + 12px);
                left: 5vw; right: auto; transform: none;
                width: 90vw; box-sizing: border-box;
            }
            .pl-head span { display: none; }
            .pl-list { display: flex; flex-wrap: wrap; gap: 0 14px; }
            .pulse { width: auto; }
            .mast-top span:last-child { display: none; }
            .tk-label { padding: 0 10px; font-size: 11px; }
        }

        /* Fix issue on mobile browser where scroll breaks  */
        .mapboxgl-canvas-container.mapboxgl-touch-zoom-rotate.mapboxgl-touch-drag-pan,
        .mapboxgl-canvas-container.mapboxgl-touch-zoom-rotate.mapboxgl-touch-drag-pan .mapboxgl-canvas {
            touch-action: unset;
        }

        @media (prefers-reduced-motion: reduce) {
            .dot::after, .cue span { animation: none; }
            .tk-window { overflow-x: auto; }
            .tk-track { animation: none; }
            .card { transition: none; }
        }
    </style>
</head>
<body>

<div id="map"></div>
<div id="story"></div>
<div id="cards"></div>
<div id="pulses" data-side="right"></div>
<div id="ticker" class="empty">
    <div class="tk-label">On the record</div>
    <div class="tk-window"><div class="tk-track" id="tk-track"></div></div>
</div>

<script src="./config.js"></script>
<script src="./protests.js"></script>
<script src="./quotes.js"></script>

var EV = PROTESTS;
var QUOTE_LIST = (typeof QUOTES !== 'undefined') ? QUOTES : [];
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var alignments = { 'left': 'lefty', 'center': 'centered', 'right': 'righty', 'full': 'centered' };
var EVBYID = {};
EV.forEach(function(e) { EVBYID[e.id] = e; });
var activeChapter = config.chapters[0];
var openPulseId = null;

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function isMobile() { return window.matchMedia('(max-width: 750px)').matches; }
function fmtDate(d) {
    var p = d.split('-');
    return p.length === 2 ? MONTHS[p[1] - 1] + ' ' + p[0] : MONTHS[p[1] - 1] + ' ' + (+p[2]) + ', ' + p[0];
}
function sortDate(e) { return e.date.length === 7 ? e.date + '-15' : e.date; }
function inRange(e, ch) { var d = sortDate(e); return d >= ch.from && d <= ch.to; }
// headlines in the data sometimes lost their opening quote mark, e.g.  How I can feed my family now?': ...
function cleanHed(s) { return s.replace(/^([^'"“”‘’]+)'(:.*)$/, '“$1”$2'); }
function headlineParts(e) { return e.title.split(/\s+[—–]\s+/).map(function(h) { return cleanHed(h.trim()); }).filter(Boolean); }

function nationalFor(ch) { return EV.filter(function(e) { return e.kind === 'national' && inRange(e, ch); }); }
function pointsFor(ch) {
    var f = [];
    EV.forEach(function(e) {
        if (e.kind !== 'point' || !inRange(e, ch)) return;
        e.locs.forEach(function(l) { f.push({ type: 'Feature', properties: { eid: e.id }, geometry: { type: 'Point', coordinates: l } }); });
    });
    return { type: 'FeatureCollection', features: f };
}

// ---------- article-style clipping for popups ----------
function articleHTML(e) {
    var parts = headlineParts(e);
    var hed = parts[0], deck = parts.slice(1).join(' — ');
    return '<article class="clip">' +
        '<div class="clip-meta" dir="auto">' + esc(e.source) + ' &middot; ' + fmtDate(e.date) + '</div>' +
        '<h4 class="clip-hed" dir="auto">' + esc(hed) + '</h4>' +
        (deck ? '<div class="clip-deck" dir="auto">' + esc(deck) + '</div>' : '') +
        '<p class="clip-body" dir="auto">' + esc(e.text) + '</p></article>';
}

// ---------- build the story ----------
var story = document.getElementById('story');
var cardsEl = document.getElementById('cards');

var years = EV.map(function(e) { return +e.date.slice(0, 4); });
var masthead = document.createElement('header');
masthead.id = 'masthead';
var mh = '<div class="mast-top"><span>' + (config.byline || '') + '</span><span>Protests ' + Math.min.apply(null, years) + ' &ndash; ' + Math.max.apply(null, years) + '</span></div>';
if (config.title) mh += '<h1>' + esc(config.title) + '</h1>';
if (config.subtitle) mh += '<h2>' + esc(config.subtitle) + '</h2>';
if (config.introduction) {
    mh += '<div class="intro">' + config.introduction.split(/\n\s*\n/).map(function(p) { return '<p>' + esc(p) + '</p>'; }).join('') + '</div>';
}
mh += '<div class="cue"><span>Scroll to begin &darr;</span></div>';
masthead.innerHTML = mh;
story.appendChild(masthead);

function kicker(r) {
    var a = r.from.slice(0, 4), b = +r.to.slice(0, 4) > 2025 ? 'Present' : r.to.slice(0, 4);
    return a === b ? a : a + ' &ndash; ' + b;
}
var features = document.createElement('div');
features.id = 'features';
config.chapters.forEach(function(record) {
    var step = document.createElement('div');
    step.className = 'step';
    step.id = record.id;
    features.appendChild(step);

    var card = document.createElement('section');
    card.className = 'card ' + (alignments[record.alignment] || 'centered');
    card.setAttribute('data-chapter', record.id);
    var html = '';
    if (record.title) html += '<div class="card-kicker">' + kicker(record) + '</div><h3>' + esc(record.title) + '</h3>';
    html += '<div class="card-body">' + (record.description || '') + '</div>';
    card.innerHTML = html;
    cardsEl.appendChild(card);
});
story.appendChild(features);

if (config.githubUrl) {
    var footer = document.createElement('footer');
    footer.id = 'footer';
    footer.innerHTML = '<a href="' + esc(config.githubUrl) + '" target="_blank" rel="noopener">Code &amp; data on GitHub &nearr;</a>';
    story.appendChild(footer);
}

// ---------- map ----------
mapboxgl.accessToken = config.accessToken;
var map = new mapboxgl.Map({
    container: 'map',
    style: config.style,
    center: config.chapters[0].location.center,
    zoom: config.chapters[0].location.zoom,
    bearing: config.chapters[0].location.bearing,
    pitch: config.chapters[0].location.pitch,
    interactive: true
});
// the story is scroll-driven: switch off direct navigation but keep clicks working
['scrollZoom', 'boxZoom', 'dragRotate', 'dragPan', 'keyboard', 'doubleClickZoom', 'touchZoomRotate'].forEach(function(h) { if (map[h]) map[h].disable(); });
var scroller = scrollama();

function setPulseOn(id) {
    openPulseId = id;
    document.querySelectorAll('.pulse').forEach(function(b) { b.classList.toggle('on', b.getAttribute('data-id') === id); });
}
function removePopups() {
    var p = document.getElementsByClassName('mapboxgl-popup');
    while (p[0]) p[0].remove();
    setPulseOn(null);
}
function showEvents(ids, lngLat, anchor, pulseId) {
    var evs = EV.filter(function(e) { return ids.indexOf(e.id) !== -1; });
    if (!evs.length) return;
    removePopups();
    var opts = { closeOnClick: true, maxWidth: '280px', offset: 12 };
    if (anchor) opts.anchor = anchor;
    var popup = new mapboxgl.Popup(opts).setLngLat(lngLat)
        .setHTML('<div class="popup-text">' + evs.map(articleHTML).join('') + '</div>').addTo(map);
    if (pulseId) {
        setPulseOn(pulseId);
        popup.on('close', function() { if (openPulseId === pulseId) setPulseOn(null); });
    }
}

// ---------- nationwide protests: pulses ----------
var pulsesEl = document.getElementById('pulses');
function buildPulses(ch) {
    var nat = ch.rings ? nationalFor(ch) : [];
    pulsesEl.classList.toggle('empty', !nat.length);
    pulsesEl.innerHTML = '';
    if (!nat.length) return;
    // keep the pulses on the side of the screen opposite the text card
    pulsesEl.setAttribute('data-side', ch.alignment === 'right' ? 'left' : 'right');
    pulsesEl.innerHTML = '<div class="pl-head"><strong>Nationwide</strong><span>Click a pulse to read</span></div><div class="pl-list"></div>';
    var list = pulsesEl.querySelector('.pl-list');
    nat.forEach(function(e, i) {
        var b = document.createElement('button');
        b.className = 'pulse';
        b.setAttribute('data-id', e.id);
        b.setAttribute('aria-label', 'Nationwide protest, ' + fmtDate(e.date));
        b.title = headlineParts(e)[0];
        b.innerHTML = '<span class="dot" style="--d:' + (i * 0.35).toFixed(2) + 's"></span><span class="pl-date">' + fmtDate(e.date) + '</span>';
        b.addEventListener('click', function(ev) { ev.stopPropagation(); showNational(e.id, b); });
        list.appendChild(b);
    });
}
function showNational(id, btn) {
    btn = btn || pulsesEl.querySelector('[data-id="' + id + '"]');

    var pt = [m.width / 2, m.height / 2], anchor;
    if (btn) {
        var r = btn.getBoundingClientRect(), box = pulsesEl.getBoundingClientRect();
        if (isMobile()) { pt = [m.width / 2, box.top - m.top - 4]; anchor = 'bottom'; }
        else if (pulsesEl.getAttribute('data-side') === 'right') { pt = [box.left - m.left - 6, r.top + r.height / 2 - m.top]; anchor = 'right'; }
        else { pt = [box.right - m.left + 6, r.top + r.height / 2 - m.top]; anchor = 'left'; }
    }
    showEvents([id], map.unproject(pt), anchor, id);
}

// ---------- news ticker: quotes + headlines from the sources ----------
var tickerEl = document.getElementById('ticker');
var trackEl = document.getElementById('tk-track');
function tickerItemsFor(ch) {
    var items = [];
    EV.filter(function(e) { return inRange(e, ch); })
      .sort(function(a, b) { return sortDate(a) < sortDate(b) ? -1 : sortDate(a) > sortDate(b) ? 1 : 0; })
      .forEach(function(e) {
        QUOTE_LIST.filter(function(q) { return q.event === e.id; }).forEach(function(q) {
            items.push({ kind: 'quote', id: e.id, text: q.text, who: q.who, source: q.source || e.source, date: q.date || e.date });
        });
        headlineParts(e).forEach(function(h) { items.push({ kind: 'headline', id: e.id, text: h, source: e.source, date: e.date }); });
    });
    return items;
}
function itemHTML(it) {
    var src = (it.who ? esc(it.who) + ' &middot; ' : '') + esc(it.source) + ' &middot; ' + fmtDate(it.date);
    if (it.kind === 'quote') {
        return '<span class="tk-item quote" data-event="' + it.id + '"><span class="tk-tag">Quote</span>' +
            '<span class="tk-text tk-quote" dir="auto">&ldquo;' + esc(it.text) + '&rdquo;</span><span class="tk-src" dir="auto">' + src + '</span></span>';
    }
    return '<span class="tk-item" data-event="' + it.id + '"><span class="tk-tag">Headline</span>' +
        '<span class="tk-text tk-head" dir="auto">' + esc(it.text) + '</span><span class="tk-src" dir="auto">' + src + '</span></span>';
}
function buildTicker(ch) {
    var items = tickerItemsFor(ch);
    tickerEl.classList.toggle('empty', !items.length);
    if (!items.length) { trackEl.innerHTML = ''; return; }
    var one = items.map(itemHTML).join('');
    var win = trackEl.parentNode;
    trackEl.style.animation = 'none';
    trackEl.innerHTML = '<span class="tk-group">' + one + '</span>';
    var w = trackEl.firstChild.getBoundingClientRect().width, k = 1;
    while (w * k < win.clientWidth * 1.1 && k < 8) k++;
    var g = '';
    for (var i = 0; i < k; i++) g += one;
    trackEl.innerHTML = '<span class="tk-group">' + g + '</span><span class="tk-group" aria-hidden="true">' + g + '</span>';
    var gw = trackEl.firstChild.getBoundingClientRect().width;
    trackEl.style.animation = '';
    trackEl.style.animationDuration = Math.max(25, gw / 75) + 's';
}
trackEl.addEventListener('click', function(ev) {
    var it = ev.target.closest && ev.target.closest('.tk-item');
    if (it) openEvent(it.getAttribute('data-event'));
});

// ---------- opening an event from the text, ticker or map ----------
function openEvent(id) {
    var e = EVBYID[id];
    if (!e) return;
    if (e.kind === 'national') {
        showNational(id);
    } else if (e.locs.length) {
        map.flyTo({ center: e.locs[0], zoom: Math.max(map.getZoom(), 9.5), speed: 0.8 });
        map.once('moveend', function() { showEvents([id], e.locs[0]); });
    }
}
document.addEventListener('click', function(ev) {
    var m = ev.target.closest && ev.target.closest('mark.hl[data-event]');
    if (m) openEvent(m.getAttribute('data-event'));
});
map.on('click', function(e) {
    if (!map.getLayer('places')) return;
    var pad = 8;
    var box = [[e.point.x - pad, e.point.y - pad], [e.point.x + pad, e.point.y + pad]];
    var hits = map.queryRenderedFeatures(box, { layers: ['places'] });
    if (!hits.length) return;
    var ids = [];
    hits.forEach(function(f) { if (ids.indexOf(f.properties.eid) === -1) ids.push(f.properties.eid); });
    showEvents(ids, e.lngLat);
});

// ---------- chapters ----------
function applyChapter(ch, fly) {
    activeChapter = ch;
    document.querySelectorAll('.card').forEach(function(c) { c.classList.toggle('on', c.getAttribute('data-chapter') === ch.id); });
    if (fly) map[ch.mapAnimation || 'flyTo'](ch.location);
    if (map.getSource('places')) map.getSource('places').setData(pointsFor(ch));
    removePopups();
    buildPulses(ch);
    buildTicker(ch);
}
applyChapter(config.chapters[0], false);

// the map, text card, pulses and ticker only appear once the opening page has scrolled away
var ticking = false;
function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function() {
        ticking = false;
        var on = window.scrollY > window.innerHeight * 0.88;
        if (on !== document.body.classList.contains('map-on')) {
            document.body.classList.toggle('map-on', on);
            if (!on) removePopups();
        }
    });
}
window.addEventListener('scroll', onScroll, { passive: true });
onScroll();

map.on('load', function() {
    map.addSource('places', { type: 'geojson', data: pointsFor(activeChapter) });

    var img = new Image(72, 73);
    img.onload = function() {
        if (!map.hasImage('cedar')) map.addImage('cedar', img, { pixelRatio: 2 });
        map.addLayer({ id: 'places', type: 'symbol', source: 'places',
            layout: { 'icon-image': 'cedar', 'icon-size': 0.8, 'icon-allow-overlap': true } });
        map.on('mouseenter', 'places', function() { map.getCanvas().style.cursor = 'pointer'; });
        map.on('mouseleave', 'places', function() { map.getCanvas().style.cursor = ''; });
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(CEDAR_SVG);

    scroller.setup({ step: '.step', offset: 0.4 })
    .onStepEnter(function(response) {
        var chapter = config.chapters.find(function(c) { return c.id === response.element.id; });
        applyChapter(chapter, true);
    });
});
window.addEventListener('resize', function() { scroller.resize(); buildTicker(activeChapter); });
</script>
</body>
