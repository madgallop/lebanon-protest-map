<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8' />
    <title>Down with the Dollar! Mapping economic protests in Lebanon since 1987</title>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
    <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/mapbox/assembly/publisher-staging/src/svgs/mapbox.svg">
    <script src='https://api.tiles.mapbox.com/mapbox-gl-js/v2.11.0/mapbox-gl.js'></script>
    <link href='https://api.tiles.mapbox.com/mapbox-gl-js/v2.11.0/mapbox-gl.css' rel='stylesheet' />
    <script src="https://unpkg.com/intersection-observer@0.12.0/intersection-observer.js"></script>
    <script src="https://unpkg.com/scrollama"></script>
    <style>
        body {
            margin:0;
            padding:0;
            font-family: 'Avenir', sans-serif;;
        }
        :root {
            --red: #6b1a1f;       /* solid dark red panels */
            --red-deep: #4a1014;
            --cream: #fbeeea;     /* text on red */
            --hl: #f4d9a6;        /* highlighter */
        }
        a, a:hover, a:visited {
            color: #ffc9b9;
        }
        #map {
            top:0;
            height: 100vh;
            width:100vw;
            position: fixed;
        }
        .map-container {
            display: block; /* Adjust as needed based on your initial setup */
        }
        #header {
            margin: auto;
            width: 100%;
            position: relative;
            z-index: 5;
        }
        #header h1, #header h2, #header p {
            margin: 0;
            padding: 2vh 2vw;
            text-align: center;
        }
        #exposition {
            margin: auto;
            width: 100%;
            position: relative;
            background-color: var(--red);
            color: var(--cream);
            z-index: 5;
        }
        #exposition p{
            margin: 0;
            padding: 2vh 2vw;
            text-align: center;
        }
        #features {
            padding-top: 10vh;
            padding-bottom: 10vh;
        }
        .hidden {
            visibility: hidden;
        }
        .centered {
            width: 50vw;
            margin: 0 auto;
        }
        .lefty {
            width: 33vw;
            margin-left: 5vw;
        }
        .righty {
            width: 33vw;
            margin-left: 62vw;
        }
        .fully {
            width: 100%;
            margin: auto;
        }
        .light {
            color: var(--cream);
            background-color: var(--red);
        }
        .dark {
            color: var(--cream);
            background-color: var(--red-deep);
        }
        .step {
            padding-bottom: 50vh;
            /* margin-bottom: 10vh; */
            opacity: 0.35;
            transition: opacity 0.4s;
        }
        .step.active {
            opacity: 1;
        }
        /* words highlighted from the protests: the highlighter sweeps in when the chapter is active */
        mark.hl {
            color: inherit;
            padding: 0 3px;
            background-color: transparent;
            background-image: linear-gradient(var(--hl), var(--hl));
            background-repeat: no-repeat;
            background-position: 0 100%;
            background-size: 0% 100%;
            transition: background-size 1s ease 0.3s, color 0.4s ease 0.3s;
            -webkit-box-decoration-break: clone;
            box-decoration-break: clone;
        }
        .step.active mark.hl {
            background-size: 100% 100%;
            color: var(--red-deep);
        }
        mark.hl[data-place] { cursor: pointer; }
        mark.hl[data-place]:hover { text-decoration: underline; }

        .step div {
            padding:  25px 50px;
            line-height: 25px;
            font-size: 13px;
        }

        .step img {
            width: 100%;
        }
        /* Marker tweaks */

        .mapboxgl-popup-content {
            font: 400 15px/22px 'Source Sans Pro', 'Helvetica Neue', sans-serif;
            padding: 0;
            width: 260px;
            color: var(--cream);
            background-color: var(--red);
            /* Add box shadow for the outer glow effect */
            box-shadow: 0px 0px 10px 2px rgba(0, 0, 0, 0.5);
            border-radius: 5px; /* Optional: Add border-radius for rounded corners */
        }

        .popup-text {
            margin: 0;
            padding: 10px;
            font-weight: 400;
            font-size: 13px;
            line-height: 18px;
            color: var(--cream);
            max-height: 220px;
            overflow-y: auto;
        }
        .popup-text p { margin: 6px 0 0; }
        .chapter-button { cursor: pointer; }
        #footer {
            position: relative;
            z-index: 5;
            padding: 2vh 5vw;
            font-size: 12px;
            line-height: 18px;
            text-align: center;
        }


        .mapboxgl-popup-anchor-top > .mapboxgl-popup-content {
        margin-top: 15px;
        }
        .mapboxgl-popup-close-button { color: var(--cream); font-size: 18px; }
        .mapboxgl-popup-close-button:hover { background: transparent; color: var(--hl); }
        .mapboxgl-popup-anchor-top .mapboxgl-popup-tip,
        .mapboxgl-popup-anchor-top-left .mapboxgl-popup-tip,
        .mapboxgl-popup-anchor-top-right .mapboxgl-popup-tip { border-bottom-color: var(--red); }
        .mapboxgl-popup-anchor-bottom .mapboxgl-popup-tip,
        .mapboxgl-popup-anchor-bottom-left .mapboxgl-popup-tip,
        .mapboxgl-popup-anchor-bottom-right .mapboxgl-popup-tip { border-top-color: var(--red); }
        .mapboxgl-popup-anchor-left .mapboxgl-popup-tip { border-right-color: var(--red); }
        .mapboxgl-popup-anchor-right .mapboxgl-popup-tip { border-left-color: var(--red); }
        #debugbox {
            position: fixed; top: 8px; left: 8px; z-index: 1000; width: 340px; height: 240px;
            font: 11px/14px monospace; background: #fff; color: #000; border: 2px solid var(--red);
        }

        @media (max-width: 750px) {
            .centered, .lefty, .righty, .fully {
                width: 90vw;
                margin: 0 auto;
            }
        }

        /* Fix issue on mobile browser where scroll breaks  */
        .mapboxgl-canvas-container.mapboxgl-touch-zoom-rotate.mapboxgl-touch-drag-pan,
        .mapboxgl-canvas-container.mapboxgl-touch-zoom-rotate.mapboxgl-touch-drag-pan .mapboxgl-canvas {
            touch-action: unset;
        }

        
        .ev { padding: 8px 4px; border-top: 1px solid rgba(251,238,234,.3); }
        .ev:first-child { border-top: 0; }
        .ev .evt { font-style: italic; margin: 2px 0 0; }
        .ev p { margin: 4px 0 0; }
        .chips { padding: 0 50px 25px; }
        .chips-label { font-size: 12px; margin-bottom: 6px; }
        .chip { margin: 0 6px 6px 0; padding: 3px 8px; font: 12px 'Avenir', sans-serif; cursor: pointer;
                background: transparent; color: var(--cream); border: 1px solid var(--cream); border-radius: 12px; }
        .chip:hover, .chip.on { background: var(--hl); color: var(--red-deep); border-color: var(--hl); }
        </style>
</head>

var RING_CENTER = [35.85, 33.88];
var RING_TOP = {};
var activeChapter = config.chapters[0];

function fmtDate(d) {
    var p = d.split('-');
    return p.length === 2 ? MONTHS[p[1] - 1] + ' ' + p[0] : MONTHS[p[1] - 1] + ' ' + (+p[2]) + ', ' + p[0];
}
function inRange(e, ch) { return e.date >= ch.from && e.date <= ch.to; }
function eventHTML(e) {
    return '<div class="ev"><strong>' + fmtDate(e.date) + '</strong> &middot; ' + e.source +
        '<div class="evt" dir="auto">' + e.title + '</div><p dir="auto">' + e.text + '</p></div>';
}
function nationalFor(ch) {
    return EV.filter(e => e.kind === 'national' && inRange(e, ch));
}
function pointsFor(ch) {
    var f = [];
    EV.forEach(e => {
        if (e.kind !== 'point' || !inRange(e, ch)) return;
        e.locs.forEach(l => f.push({ type: 'Feature', properties: { eid: e.id }, geometry: { type: 'Point', coordinates: l } }));
    });
    return { type: 'FeatureCollection', features: f };
}
// nationwide protests are drawn as nested rings over the whole country (oldest = smallest)
function ringsFor(ch) {
    var nat = ch.rings ? nationalFor(ch) : [], f = [];
    RING_TOP = {};
    nat.forEach((e, i) => {
        var rx = nat.length === 1 ? 0.27 : 0.12 + 0.30 * i / (nat.length - 1), ry = rx * 1.8, c = [];
        for (var a = 0; a <= 72; a++) {
            var t = a / 72 * 2 * Math.PI;
            c.push([RING_CENTER[0] + rx * Math.cos(t), RING_CENTER[1] + ry * Math.sin(t)]);
        }
        RING_TOP[e.id] = [RING_CENTER[0], RING_CENTER[1] + ry];
        f.push({ type: 'Feature', properties: { eid: e.id }, geometry: { type: 'LineString', coordinates: c } });
    });
    return { type: 'FeatureCollection', features: f };
}

// ---------- build the story ----------
var story = document.getElementById('story');
var features = document.createElement('div');
features.setAttribute('id', 'features');
var header = document.createElement('div');
var exposition = document.createElement('div');
if (config.title) { var h1 = document.createElement('h1'); h1.innerText = config.title; header.appendChild(h1); }
if (config.subtitle) { var h2 = document.createElement('h2'); h2.innerText = config.subtitle; header.appendChild(h2); }
if (config.byline) { var by = document.createElement('p'); by.innerHTML = config.byline; header.appendChild(by); }
if (config.introduction) { var intro = document.createElement('p'); intro.innerText = config.introduction; exposition.appendChild(intro); }
if (header.innerText.length > 0) { header.classList.add(config.theme); header.setAttribute('id', 'header'); story.appendChild(header); }
if (exposition.innerText.length > 0) { exposition.classList.add(config.theme); exposition.setAttribute('id', 'exposition'); story.appendChild(exposition); }

config.chapters.forEach((record, idx) => {
    var container = document.createElement('div');
    var chapter = document.createElement('div');
    if (record.title) { var t = document.createElement('h3'); t.innerText = record.title; chapter.appendChild(t); }
    if (record.description) { var d = document.createElement('div'); d.innerHTML = record.description; chapter.appendChild(d); }
    // chips: one button per nationwide protest in this chapter
    var nat = record.rings ? nationalFor(record) : [];
    if (nat.length) {
        var chips = document.createElement('div');
        chips.className = 'chips';
        chips.innerHTML = '<div class="chips-label">Nationwide protests (the rings on the map). Click one to read about it:</div>';
        nat.forEach(e => {
            var b = document.createElement('button');
            b.className = 'chip'; b.innerText = fmtDate(e.date); b.title = e.title;
            b.addEventListener('click', () => selectNational(e.id, b));
            chips.appendChild(b);
        });
        chapter.appendChild(chips);
    }
    container.setAttribute('id', record.id);
    container.classList.add('step');
    if (idx === 0) container.classList.add('active');
    chapter.classList.add(config.theme);
    container.appendChild(chapter);
    container.classList.add(alignments[record.alignment] || 'centered');
    features.appendChild(container);
});
story.appendChild(features);

if (config.footer) {
    var footer = document.createElement('div');
    footer.setAttribute('id', 'footer');
    footer.classList.add(config.theme);
    footer.innerHTML = config.footer;
    story.appendChild(footer);
}

// ---------- map ----------
mapboxgl.accessToken = config.accessToken;
var map = new mapboxgl.Map({
    container: 'map',
    style: config.style,
    center: config.chapters[0].location.center,
    zoom: config.chapters[0].location.zoom,
    bearing: config.chapters[0].location.bearing,
    pitch: config.chapters[0].location.pitch,
    interactive: true
});
// the story is scroll-driven: switch off direct navigation but keep clicks working
['scrollZoom', 'boxZoom', 'dragRotate', 'dragPan', 'keyboard', 'doubleClickZoom', 'touchZoomRotate'].forEach(h => { if (map[h]) map[h].disable(); });
var scroller = scrollama();

function removePopups() {
    var p = document.getElementsByClassName('mapboxgl-popup');
    while (p[0]) p[0].remove();
}
function showEvents(ids, lngLat) {
    var evs = EV.filter(e => ids.indexOf(e.id) !== -1);
    if (!evs.length) return;
    removePopups();
    new mapboxgl.Popup({ closeOnClick: true, maxWidth: '280px' }).setLngLat(lngLat)
        .setHTML('<div class="popup-text">' + evs.map(eventHTML).join('') + '</div>').addTo(map);
}
function highlightRing(id) {
    if (map.getLayer('rings-hl')) map.setFilter('rings-hl', ['==', ['get', 'eid'], id || '']);
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
}
function selectNational(id, chip) {
    highlightRing(id);
    if (chip) chip.classList.add('on');
    showEvents([id], RING_TOP[id] || RING_CENTER);
}
function openEvent(id) {
    var e = EV.find(x => x.id === id);
    if (!e) return;
    if (e.kind === 'national') {
        var chip = Array.prototype.find.call(document.querySelectorAll('.chip'), c => c.title === e.title);
        selectNational(id, chip);
    } else if (e.locs.length) {
        map.flyTo({ center: e.locs[0], zoom: Math.max(map.getZoom(), 9.5), speed: 0.8 });
        map.once('moveend', () => showEvents([id], e.locs[0]));
    }
}

map.on('click', e => {
    var pad = 8;
    var box = [[e.point.x - pad, e.point.y - pad], [e.point.x + pad, e.point.y + pad]];
    var layers = ['places', 'rings'].filter(l => map.getLayer(l));
    var hits = map.queryRenderedFeatures(box, { layers: layers });
    if (!hits.length) return;
    var ids = [];
    hits.forEach(f => { if (ids.indexOf(f.properties.eid) === -1) ids.push(f.properties.eid); });
    var ringHit = hits.find(f => f.layer.id === 'rings');
    var pointHit = hits.find(f => f.layer.id === 'places');
    highlightRing(!pointHit && ringHit ? ringHit.properties.eid : '');
    showEvents(ids, pointHit ? e.lngLat : e.lngLat);
});
document.addEventListener('click', ev => {
    var m = ev.target.closest && ev.target.closest('mark.hl[data-event]');
    if (m) openEvent(m.getAttribute('data-event'));
});

map.on('load', function() {
    map.addSource('places', { type: 'geojson', data: pointsFor(activeChapter) });
    map.addSource('rings', { type: 'geojson', data: ringsFor(activeChapter) });
    map.addLayer({ id: 'rings-casing', type: 'line', source: 'rings', paint: { 'line-color': '#fbeeea', 'line-width': 4.5, 'line-opacity': 0.75 } });
    map.addLayer({ id: 'rings', type: 'line', source: 'rings', paint: { 'line-color': '#AA1823', 'line-width': 2 } });
    map.addLayer({ id: 'rings-hl', type: 'line', source: 'rings', filter: ['==', ['get', 'eid'], ''], paint: { 'line-color': '#f4d9a6', 'line-width': 6 } });

    var img = new Image(72, 73);
    img.onload = function() {
        if (!map.hasImage('cedar')) map.addImage('cedar', img, { pixelRatio: 2 });
        map.addLayer({ id: 'places', type: 'symbol', source: 'places',
            layout: { 'icon-image': 'cedar', 'icon-size': 0.8, 'icon-allow-overlap': true } });
        map.on('mouseenter', 'places', () => { map.getCanvas().style.cursor = 'pointer'; });
        map.on('mouseleave', 'places', () => { map.getCanvas().style.cursor = ''; });
        map.on('mouseenter', 'rings', () => { map.getCanvas().style.cursor = 'pointer'; });
        map.on('mouseleave', 'rings', () => { map.getCanvas().style.cursor = ''; });
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(CEDAR_SVG);

    scroller.setup({ step: '.step', offset: 0.5, progress: true })
    .onStepEnter(response => {
        var chapter = config.chapters.find(c => c.id === response.element.id);
        activeChapter = chapter;
        response.element.classList.add('active');
        map[chapter.mapAnimation || 'flyTo'](chapter.location);
        // time-scrolling: show only the protests from this chapter's years
        map.getSource('places').setData(pointsFor(chapter));
        map.getSource('rings').setData(ringsFor(chapter));
        highlightRing('');
        removePopups();
    })
    .onStepExit(response => {
        response.element.classList.remove('active');
    });
});
window.addEventListener('resize', scroller.resize);
</script>
</body>
</html>
